<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ee" />
    <script>
      (() => {
        try {
          const saved = window.localStorage.getItem("portfolio-theme");
          const explicitChoice = window.localStorage.getItem("portfolio-theme-explicit") === "true";
          // Old automatic system-theme values do not override the new light default.
          document.documentElement.dataset.theme =
            explicitChoice && (saved === "dark" || saved === "light") ? saved : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
