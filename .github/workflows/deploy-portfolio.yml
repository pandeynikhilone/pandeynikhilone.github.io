name: Refresh and Deploy Career Portfolio

on:
  push:
    branches: [main]
  schedule:
    # 00:07 India time (18:37 UTC) every day.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: career-portfolio-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate React app, copy, and project data
        run: npm run check

      - name: Validate project automation scripts
        run: python -m py_compile scripts/update_auto_projects.py scripts/manage_project_issue.py

      - name: Refresh opted-in public repository catalog
        id: discover
        continue-on-error: true
        run: python scripts/update_auto_projects.py

      - name: Preserve last known catalog if discovery fails
        if: steps.discover.outcome == 'failure'
        run: |
          echo "::warning::GitHub repository discovery failed; keeping the last committed auto-projects.json."
          git checkout -- data/auto-projects.json

      - name: Commit updated automatic catalog if changed
        run: |
          if git diff --quiet -- data/auto-projects.json; then
            echo "Automatic project catalog is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/auto-projects.json
            git commit -m "Refresh automatic portfolio project catalog"

            # Retry from the latest main if another run changed the catalog.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                git reset --hard origin/main

                # Regenerate from the newest committed catalog so manual hide
                # overrides are preserved and timestamp-only commits are avoided.
                python scripts/update_auto_projects.py
                git add data/auto-projects.json
                if git diff --cached --quiet; then
                  echo "Remote catalog already matches the latest discovery result."
                  exit 0
                fi
                git commit -m "Refresh automatic portfolio project catalog"
              fi

              if git push origin HEAD:main; then
                echo "Automatic project catalog committed successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed. Refreshing from main and retrying."
              sleep $((attempt * 2))
            done

            echo "Could not push the automatic catalog after 3 attempts."
            exit 1
          fi

      - name: Build React application
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          test -s dist/data/projects.json
          test -s dist/data/auto-projects.json
          echo "React site and project catalog assets are ready."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
