name: Refresh and Deploy Career Portfolio

on:
  push:
    branches: [main]
  schedule:
    # 00:07 India time (18:37 UTC) every day.
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: career-portfolio-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate portfolio copy, JSON, and JavaScript
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          forbidden = chr(0x2014)
          for filename in ("index.html", "data/projects.json", "README.md"):
              content = Path(filename).read_text(encoding="utf-8")
              if forbidden in content:
                  raise SystemExit(f"Forbidden em dash character found in {filename}")

          json.loads(Path("data/projects.json").read_text(encoding="utf-8"))
          json.loads(Path("data/auto-projects.json").read_text(encoding="utf-8"))

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found to validate")
          for index, script in enumerate(scripts, start=1):
              result = subprocess.run(
                  ["node", "--check", "-"],
                  input=script,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(f"JavaScript syntax check failed for script {index}")
          print("Portfolio copy, project JSON, and JavaScript validation passed.")
          PY

      - name: Validate project automation scripts
        run: python -m py_compile scripts/update_auto_projects.py scripts/manage_project_issue.py

      - name: Refresh opted-in public repository catalog
        id: discover
        continue-on-error: true
        run: python scripts/update_auto_projects.py

      - name: Preserve last known catalog if discovery fails
        if: steps.discover.outcome == 'failure'
        run: |
          echo "::warning::GitHub repository discovery failed; keeping the last committed auto-projects.json."
          git checkout -- data/auto-projects.json

      - name: Commit updated automatic catalog if changed
        run: |
          if git diff --quiet -- data/auto-projects.json; then
            echo "Automatic project catalog is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/auto-projects.json
            git commit -m "Refresh automatic portfolio project catalog"

            # The owner may commit site changes while discovery is running.
            # Rebase the catalog-only commit onto the latest main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase automatic catalog. Review the catalog conflict before retrying."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Automatic project catalog committed successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed. Retrying after refresh."
              sleep $((attempt * 2))
            done

            echo "Could not push the automatic catalog after 3 attempts."
            exit 1
          fi

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/projects.json _site/data/projects.json
          cp data/auto-projects.json _site/data/auto-projects.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
