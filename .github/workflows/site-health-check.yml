name: Portfolio Daily Health Audit

on:
  schedule:
    # Runs daily at 09:07 India time (03:37 UTC).
    - cron: "37 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh and Deploy Career Portfolio"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-health-audit
  cancel-in-progress: false

jobs:
  audit-live-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install site dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm install --no-save --package-lock=false --no-audit --no-fund playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit production site, links, themes, and mobile layout
        env:
          SITE_URL: https://pandeynikhilone.github.io/
        run: node scripts/site-health-check.mjs

      - name: Upload health report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-health-report
          path: |
            site-health-report.md
            site-health-desktop.png
            site-health-mobile.png
          if-no-files-found: warn
          retention-days: 30

      - name: Create or refresh one health issue when an audit fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const title = "Portfolio health audit needs attention";
            let report = "The portfolio health workflow failed before a report could be generated.";
            if (fs.existsSync("site-health-report.md")) {
              report = fs.readFileSync("site-health-report.md", "utf8");
              if (report.length > 55000) report = report.slice(0, 55000) + "\n\n[Report shortened to fit the issue body.]";
            }
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const body = report + "\n\n**Workflow run:** " + runUrl + "\n\nThis issue is refreshed by the scheduled health audit. Close it after the reported problems are resolved.";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = existing.data.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
              core.info("Updated existing health issue #" + issue.number + ".");
            } else {
              const created = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              core.warning("Created health issue #" + created.data.number + ".");
            }

      - name: Explain a successful audit
        if: success()
        run: echo "Portfolio health audit completed without confirmed failures. Review the job summary and artifact for link-verification warnings."
